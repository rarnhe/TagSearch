name: C++ Windows Tests

on:
  push:
    branches: [main]
    paths-ignore: [test_report.md]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cpp-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7

      - name: Configure
        id: configure
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          New-Item -ItemType Directory -Force out/test-logs | Out-Null
          cmake -S . -B out/test -A x64 -DBUILD_TESTING=ON "-DCMAKE_CXX_FLAGS=/analyze /we28251" 2>&1 | Tee-Object out/test-logs/configure.log
          "Exit code: $LASTEXITCODE" | Add-Content out/test-logs/configure.log
          exit $LASTEXITCODE

      - name: Build application and tests
        id: build
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          cmake --build out/test --config Release --parallel 2>&1 | Tee-Object out/test-logs/build.log
          "Exit code: $LASTEXITCODE" | Add-Content out/test-logs/build.log
          exit $LASTEXITCODE

      - name: Run CTest
        id: ctest
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          ctest --test-dir out/test -C Release --output-on-failure --no-tests=error --output-junit test-results.xml 2>&1 | Tee-Object out/test-logs/ctest.log
          "Exit code: $LASTEXITCODE" | Add-Content out/test-logs/ctest.log
          exit $LASTEXITCODE

      - name: Write Markdown report and Actions summary
        if: always()
        run: |
          try {
            if (Test-Path -LiteralPath test_report.md) {
              Remove-Item -LiteralPath test_report.md -Force
            }
            ./tests/write_report.ps1 -Configure '${{ steps.configure.outcome }}' -Build '${{ steps.build.outcome }}' -Test '${{ steps.ctest.outcome }}' -LogDirectory out/test-logs
          } catch {
            $details = [System.Net.WebUtility]::HtmlEncode(($_ | Out-String))
            $fallback = [System.Collections.Generic.List[string]]::new()
            @(
              "# TagSearch C++ Windows 测试报告",
              "",
              "- 状态：失败（报告生成脚本异常，已写入降级报告）",
              "- Configure=${{ steps.configure.outcome }} / Build=${{ steps.build.outcome }} / CTest=${{ steps.ctest.outcome }}",
              "",
              "## 报告生成错误",
              "<pre>$details</pre>"
            ) | ForEach-Object { $fallback.Add($_) }
            foreach ($phase in @("configure", "build", "ctest")) {
              $log = "out/test-logs/$phase.log"
              if (Test-Path -LiteralPath $log) {
                try {
                  $output = (Get-Content -LiteralPath $log -Tail 80) -join [Environment]::NewLine
                  $fallback.Add("")
                  $fallback.Add("### $phase 最后 80 行")
                  $fallback.Add("<pre>$([System.Net.WebUtility]::HtmlEncode($output))</pre>")
                } catch {
                  $fallback.Add("读取 $phase 日志失败：$($_.Exception.Message)")
                }
              }
            }
            $fallback | Set-Content -LiteralPath test_report.md -Encoding utf8
            Write-Warning "The detailed report writer failed; a fallback test_report.md was written."
          }

          if (!(Test-Path -LiteralPath test_report.md) -or (Get-Item -LiteralPath test_report.md).Length -eq 0) {
            @(
              "# TagSearch C++ Windows 测试报告",
              "",
              "- 状态：失败（未生成详细报告，已写入兜底报告）",
              "- Configure=${{ steps.configure.outcome }} / Build=${{ steps.build.outcome }} / CTest=${{ steps.ctest.outcome }}"
            ) | Set-Content -LiteralPath test_report.md -Encoding utf8
          }

      - name: Preserve report and diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: tagsearch-cpp-windows-test-report
          if-no-files-found: warn
          path: |
            test_report.md
            out/test-logs/
            out/test/test-results.xml
            out/test/Testing/Temporary/
            out/test/CMakeFiles/CMakeConfigureLog.yaml

      - name: Commit report on main
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          if (!(Test-Path test_report.md)) { throw 'Report missing' }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- test_report.md
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 1) {
            git commit -m "docs: update TagSearch test report [skip ci]"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            git push origin HEAD:main
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } elseif ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  presets:
    name: CMake presets (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86
            host: x64
            runner: windows-latest
            machine: "14C"
          - arch: x64
            host: x64
            runner: windows-latest
            machine: "8664"
          - arch: arm64
            host: arm64
            runner: windows-11-arm
            machine: "AA64"
    steps:
      - uses: actions/checkout@v7

      - name: Build and test Debug, Release, RelWithDebInfo and MinSizeRel
        shell: cmd
        env:
          TARGET_ARCH: ${{ matrix.arch }}
          HOST_ARCH: ${{ matrix.host }}
          TARGET_MACHINE: ${{ matrix.machine }}
        run: |
          for /f "usebackq delims=" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath`) do set "VS_INSTALL=%%i"
          if not defined VS_INSTALL exit /b 1
          call "%VS_INSTALL%\Common7\Tools\VsDevCmd.bat" -arch=%TARGET_ARCH% -host_arch=%HOST_ARCH% || exit /b 1
          for %%c in (debug release relwithdebinfo minsizerel) do (
            cmake --preset %TARGET_ARCH%-%%c || exit /b 1
            cmake --build --preset %TARGET_ARCH%-%%c --parallel || exit /b 1
            for %%t in (TagSearch_TreeView TagSearch_Caption) do (
              dumpbin /headers "out\build\%TARGET_ARCH%-%%c\%%t.exe" | findstr /i /c:"%TARGET_MACHINE% machine" || exit /b 1
            )
            ctest --preset %TARGET_ARCH%-%%c || exit /b 1
          )

      - name: Preserve failed preset diagnostics
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: tagsearch-presets-${{ matrix.arch }}-diagnostics
          if-no-files-found: ignore
          path: |
            out/build/*/Testing/Temporary/
            out/build/*/CMakeFiles/CMakeConfigureLog.yaml
